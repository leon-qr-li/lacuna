name: Cloud image

# Builds the cloud container (Dockerfile) and smoke-tests it: health, non-root, Access token required,
# fails closed. Runs on PRs that can change the image; deploy.yml builds and ships it from green main.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - lacuna_app/**
      - lacuna_core/**
      - pyproject.toml
      - web/package.json
      - web/package-lock.json
      - .github/workflows/cloud.yml
  workflow_dispatch:

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lacuna:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=lacuna
          cache-to: type=gha,scope=lacuna,mode=max
      - name: Smoke test
        run: deploy/smoke_container.sh lacuna:ci
