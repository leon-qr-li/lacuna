name: CI

# Leon works on Windows, Pei on macOS (Apple Silicon); nobody can hand-test the Mac side,
# so this matrix is the Mac verification. Linux is the cloud dev box.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide what this change can affect, so a docs edit or a UI label tweak doesn't run everything.
  #   docs only (*.md, docs/, design/)      -> nothing runs
  #   web/ only                             -> UI build + E2E (pytest skipped)
  #   Python (engine, app, tests, scripts)  -> pytest + UI build + E2E (E2E drives the real backend)
  #   CI config or any unknown path         -> everything
  # Whatever runs, runs on all three OSes: Mac-only bugs have shown up in both Python and UI code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.classify.outputs.python }}
      web: ${{ steps.classify.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          python=false; web=false
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ -z "$BASE" ] \
             || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
             || ! files=$(git diff --name-only "$BASE"...HEAD); then
            python=true; web=true; files="(full run)"
          fi
          echo "$files"
          for f in $files; do
            case "$f" in
              *.md|docs/*|design/*|.gitignore) ;;
              web/*) web=true ;;
              lacuna_core/*|lacuna_app/*|tests/*|scripts/*|spikes/*|pyproject.toml) python=true ;;
              *) python=true; web=true ;;
            esac
          done
          echo "python=$python web=$web"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv installs the same packages as pip, several times faster (pip was ~35-50 s on Windows)
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install ffmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Install Python package
        run: uv pip install --system -e ".[test,claude]"

      - name: Engine + API tests
        if: needs.changes.outputs.python == 'true'
        run: python -m pytest -q -rs --durations=8 tests

      - name: Build UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Chromium for Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install chromium

      - name: Install Chromium system libraries (Linux)
        if: runner.os == 'Linux'
        working-directory: web
        run: npx playwright install-deps chromium

      - name: E2E (Chromium against the real backend)
        working-directory: web
        env:
          PYTHON: python
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

  # The one check to read before merging: green when every job that had to run passed,
  # including when the change was docs-only and nothing needed to run.
  ci-ok:
    name: CI ok
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "changes=${{ needs.changes.result }} test=${{ needs.test.result }}"
          [ "${{ needs.changes.result }}" = success ] || exit 1
          case "${{ needs.test.result }}" in success|skipped) ;; *) exit 1 ;; esac
