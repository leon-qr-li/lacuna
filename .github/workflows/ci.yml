name: CI

# Linux only: the product runs only in the cloud image (Linux), and the desktop app is retired.
# Windows/macOS runs tested nothing users see and caused nearly all the flaky failures (Leon 2026-10-23).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a PR branch cancels that PR's older run. Runs on main are never cancelled: each
# merge gets its own group (by commit), so every merge leaves a full result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide what this change can affect, so a docs edit or a UI label tweak doesn't run everything.
  #   docs only (*.md, docs/, design/)      -> nothing runs
  #   web/ only                             -> UI build + E2E (pytest skipped)
  #   Python (engine, app, tests, scripts)  -> pytest + UI build + E2E (E2E drives the real backend)
  #   CI config or any unknown path         -> everything
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.classify.outputs.python }}
      web: ${{ steps.classify.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          python=false; web=false
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ -z "$BASE" ] \
             || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
             || ! files=$(git diff --name-only "$BASE"...HEAD); then
            python=true; web=true; files="(full run)"
          fi
          echo "$files"
          for f in $files; do
            case "$f" in
              *.md|docs/*|design/*|.gitignore) ;;
              web/*) web=true ;;
              lacuna_core/*|lacuna_app/*|tests/*|scripts/*|spikes/*|pyproject.toml) python=true ;;
              *) python=true; web=true ;;
            esac
          done
          echo "python=$python web=$web"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  # pytest and the browser E2E run as separate jobs so they overlap instead of queueing behind each
  # other (they used to run back to back in one job).
  pytest:
    name: pytest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv installs the same packages as pip, several times faster
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # the runner's own package: AnimMouse/setup-ffmpeg@v1 started downloading a broken FFmpeg 9.0 archive (2026-10-23)
      # noninteractive + a lock timeout: one runner hung here (needrestart / a held dpkg lock)
      - name: Install ffmpeg
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        # apt-get update stalled with no output on some runners: time out each try and retry
        run: |
          APT="-o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do sudo -E timeout 90 apt-get $APT update -q && break; echo "apt-get update try $i failed"; done
          sudo -E timeout 180 apt-get $APT install -y -q --no-install-recommends ffmpeg

      - name: Install Python package
        run: uv pip install --system -e ".[test,claude]"

      # -n auto: one pytest worker per CPU (pytest-xdist). The suite is mostly small tests that
      # wait on files and subprocesses, so this cut it from ~150 s to ~50 s on a 4-core box.
      - name: Engine + API tests
        run: python -m pytest -q -rs --durations=8 -n auto tests

  # Split into two shards. Each shard starts its own backends, and inside a shard the specs
  # still run one at a time against them (playwright.config.ts workers: 1), as before.
  e2e:
    name: e2e ${{ matrix.shard }}/2
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Pinned: ubuntu-latest is 26.04 now, where `playwright install chromium` refuses
    # ("does not support chromium on ubuntu26.04-x64"). Move up once Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # the runner's own package: AnimMouse/setup-ffmpeg@v1 started downloading a broken FFmpeg 9.0 archive (2026-10-23)
      # noninteractive + a lock timeout: one runner hung here (needrestart / a held dpkg lock)
      - name: Install ffmpeg
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        # apt-get update stalled with no output on some runners: time out each try and retry
        run: |
          APT="-o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do sudo -E timeout 90 apt-get $APT update -q && break; echo "apt-get update try $i failed"; done
          sudo -E timeout 180 apt-get $APT install -y -q --no-install-recommends ffmpeg

      - name: Install Python package
        run: uv pip install --system -e ".[test,claude]"

      - name: Build UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Chromium for Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install chromium

      - name: Install Chromium system libraries
        working-directory: web
        run: npx playwright install-deps chromium

      - name: E2E (Chromium against the real backend)
        working-directory: web
        env:
          PYTHON: python
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.shard }}
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

  # The one check to read before merging: green when every job that had to run passed,
  # including when the change was docs-only and nothing needed to run.
  ci-ok:
    name: CI ok
    needs: [changes, pytest, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "changes=${{ needs.changes.result }} pytest=${{ needs.pytest.result }} e2e=${{ needs.e2e.result }}"
          [ "${{ needs.changes.result }}" = success ] || exit 1
          case "${{ needs.pytest.result }}" in success|skipped) ;; *) exit 1 ;; esac
          case "${{ needs.e2e.result }}" in success|skipped) ;; *) exit 1 ;; esac
