name: CI

# Leon works on Windows, Pei on macOS (Apple Silicon); nobody can hand-test the Mac side,
# so this matrix is the Mac verification. Linux is the cloud dev box.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install ffmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Install Python package
        run: python -m pip install -e ".[test]"

      - name: Engine + API tests
        run: python -m pytest -q -rs tests

      - name: Build UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      - name: E2E (Chromium against the real backend)
        working-directory: web
        env:
          PYTHON: python
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
