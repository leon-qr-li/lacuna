name: CI

# Leon works on Windows, Pei on macOS (Apple Silicon); nobody can hand-test the Mac side,
# so this matrix is the Mac verification. Linux is the cloud dev box.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv installs the same packages as pip, several times faster (pip was ~35-50 s on Windows)
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install ffmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Install Python package
        run: uv pip install --system -e ".[test,claude]"

      - name: Engine + API tests
        run: python -m pytest -q -rs --durations=8 tests

      - name: Build UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Chromium for Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install chromium

      - name: Install Chromium system libraries (Linux)
        if: runner.os == 'Linux'
        working-directory: web
        run: npx playwright install-deps chromium

      - name: E2E (Chromium against the real backend)
        working-directory: web
        env:
          PYTHON: python
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
