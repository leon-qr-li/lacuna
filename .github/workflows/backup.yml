name: Backup check

# The server backs itself up every night to Cloudflare R2 (deploy/host/lacuna-backup). This checks it
# from outside: the newest backup is under 36 h old and a sample of it restores and decrypts.
# Daily it garbage-collects the image registry (read-only meanwhile; deploys wait). Weekly it also snapshots the data volume at DigitalOcean (newest 4 kept). A failure emails the repo owner.
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RESTIC_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
    steps:
      - name: Cloud set up?
        id: ready
        run: |
          if [ -z "$DIGITALOCEAN_TOKEN" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$RESTIC_PASSWORD" ]; then
            echo "::notice::cloud secrets not set yet"; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
      - name: Free registry space (old image tags deleted after deploys)
        if: steps.ready.outputs.go == 'true'
        run: python3 deploy/ci.py registry-collect
      - name: Install restic
        if: steps.ready.outputs.go == 'true'
        # From restic's own GitHub release (pinned + checksum): the runner's Ubuntu
        # mirrors sometimes fail DNS (2026-11-11), and github.com is reachable then.
        run: |
          v=0.18.1
          curl -fsSL --retry 3 -o /tmp/restic.bz2 \
            "https://github.com/restic/restic/releases/download/v$v/restic_${v}_linux_amd64.bz2"
          echo "680838f19d67151adba227e1570cdd8af12c19cf1735783ed1ba928bc41f363d  /tmp/restic.bz2" | sha256sum -c -
          bunzip2 -c /tmp/restic.bz2 | sudo tee /usr/local/bin/restic >/dev/null
          sudo chmod +x /usr/local/bin/restic
          restic version
      - name: Backup credentials
        if: steps.ready.outputs.go == 'true'
        run: python3 deploy/ci.py r2-env
      - name: Newest backup is recent
        if: steps.ready.outputs.go == 'true'
        run: |
          last=$(restic snapshots --host lacuna --latest 1 --json -q | jq -r '.[-1].time // empty')
          [ -n "$last" ] || { echo "::error::no backup found"; exit 1; }
          age=$(( $(date +%s) - $(date -d "$last" +%s) ))
          echo "newest backup is $(( age / 3600 )) h old"
          [ "$age" -lt $(( 36 * 3600 )) ] || { echo "::error::newest backup is older than 36 h"; exit 1; }
      - name: Restore drill (the backup's canary file; no user data leaves the backup)
        if: steps.ready.outputs.go == 'true'
        run: |
          d=$(mktemp -d)
          restic restore latest --host lacuna --target "$d" --include /data/backup-canary.json -q
          python3 -c "import json,sys; print('restored canary from', json.load(open(sys.argv[1]))['at'])" \
            "$d/data/backup-canary.json"
          rm -rf "$d"
      - name: Weekly volume snapshot
        if: steps.ready.outputs.go == 'true'
        run: |
          if [ "$(date +%u)" = 7 ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then python3 deploy/ci.py snapshot; fi
