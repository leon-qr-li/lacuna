name: Backup check

# The server backs itself up every night to Cloudflare R2 (deploy/host/lacuna-backup). This checks it
# from outside: the newest backup is under 36 h old and a sample of it restores and decrypts.
# Daily it garbage-collects the image registry (read-only meanwhile; deploys wait). Weekly it also snapshots the data volume at DigitalOcean (newest 4 kept). A failure emails the repo owner.
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RESTIC_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
    steps:
      - name: Cloud set up?
        id: ready
        run: |
          if [ -z "$DIGITALOCEAN_TOKEN" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$RESTIC_PASSWORD" ]; then
            echo "::notice::cloud secrets not set yet"; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - name: Disk check
        run: python3 deploy/diag_disk.py
