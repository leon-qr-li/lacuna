[project]
name = "lacuna"
version = "0.1.0"
description = "LACUNA Studio: local-first AI podcast producer (engine + local web app)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "resvg-py>=0.5",
  "Pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
claude = ["anthropic>=1.15"]
asr = ["sherpa-onnx>=1.12"]

[project.scripts]
lacuna = "lacuna_app.__main__:main"

[tool.setuptools]
packages = ["lacuna_core", "lacuna_app"]

[tool.setuptools.package-data]
lacuna_app = ["prompts/*", "prompts/poster_examples/*", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
