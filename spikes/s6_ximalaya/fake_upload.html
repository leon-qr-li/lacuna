<!doctype html>
<!-- Stand-in for 喜马拉雅's upload page (reform-upload/page/webCenter/upload), built
     from the selectors xmly.py relies on. Used only by tests/test_s6_ximalaya.py. -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>fake upload</title></head>
<body>
<div id="landing">
  <div class="webuploader-pick">上传音频</div>
  <input id="file" type="file" style="display:none">
</div>
<form id="form" style="display:none">
  <div class="ant-form-item"><div class="ant-form-item-label">专辑</div>
    <button type="button" class="search-select-album-btn-2fDgDdbT">选择专辑</button>
    <div id="albums" style="display:none">
      <div class="scroll-item-content-252FXLKk">别的专辑</div>
      <button type="button" id="more">加载更多</button>
    </div>
    <span id="album-picked"></span>
  </div>
  <div class="ant-form-item"><div class="ant-form-item-label">标题</div>
    <input class="ant-input" placeholder="请输入声音标题"></div>
  <div class="ant-form-item"><div class="ant-form-item-label">简介</div>
    <textarea id="soundRichIntro"></textarea></div>
  <div class="ant-form-item"><div class="ant-form-item-label">权限设置</div>
    <label class="ant-radio-wrapper ant-radio-wrapper-checked"><span class="ant-radio ant-radio-checked"><input class="ant-radio-input" type="radio" name="p" value="2" checked></span>公开</label>
    <label class="ant-radio-wrapper"><span class="ant-radio"><input class="ant-radio-input" type="radio" name="p" value="1"></span>私密</label>
  </div>
  <label><input type="checkbox" id="agree">我已阅读并同意《知识产权承诺》</label>
  <div>支持 mp3、m4a、wav 格式，单个文件不超过 2GB</div>
  <button type="button" id="publish">确认发布</button>
</form>
<script>
  window.__published = 0;
  window.KindEditor = { instances: [{ _h: "", html(h) { this._h = h; }, sync() {
    document.getElementById("soundRichIntro").value = this._h; } }] };
  const $ = (id) => document.getElementById(id);
  document.querySelector(".webuploader-pick").onclick = () => $("file").click();
  $("file").onchange = () => {
    $("landing").style.display = "none";
    $("form").style.display = "";
    document.body.insertAdjacentHTML("beforeend", '<div id="up">上传中</div>');
    setTimeout(() => $("up").remove(), 300);
  };
  document.querySelector("[class*=search-select-album-btn]").onclick = () => { $("albums").style.display = ""; };
  $("more").onclick = () => {
    $("more").insertAdjacentHTML("beforebegin", '<div class="scroll-item-content-252FXLKk">洛城二三事</div>');
    $("more").remove();
  };
  $("albums").addEventListener("click", (e) => {
    if (e.target.className.startsWith("scroll-item-content")) $("album-picked").textContent = e.target.textContent;
  });
  document.querySelectorAll("label.ant-radio-wrapper").forEach((l) => l.addEventListener("click", () => {
    document.querySelectorAll("label.ant-radio-wrapper").forEach((o) => {
      o.classList.toggle("ant-radio-wrapper-checked", o === l);
      o.querySelector(".ant-radio").classList.toggle("ant-radio-checked", o === l);
      o.querySelector("input").checked = o === l;
    });
  }));
  $("publish").onclick = () => {
    window.__published += 1;
    if (!$("agree").checked) return;
    location.hash = "uploadSuccess";
  };
</script>
</body></html>
