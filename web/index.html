<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LACUNA Studio</title>
    <link rel="icon" type="image/svg+xml" href="/src/features/brand/logo.svg" />
    <!-- fonts are bundled (main.tsx); apply the saved theme before first paint (see features/theme) -->
    <script>
      try {
        var t = localStorage.getItem("lacuna.theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
